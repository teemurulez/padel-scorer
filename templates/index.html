<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel King of the Court</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Padel King of the Court</h1>
        <p class="welcome-text">Welcome to the tournament scoring system!</p>

        <div class="actions">
            <a href="{{ url_for('setup_tournament') }}" class="btn-primary">
                Start New Tournament
            </a>

            {% if has_tournaments %}
            <a href="{{ url_for('season_leaderboard') }}" class="btn-secondary">
                View Season Leaderboard
            </a>
            {% endif %}
        </div>
    </div>
</body>
</html>
