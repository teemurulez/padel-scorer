<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Tournament</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Setup New Tournament</h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <div class="message">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="tournament_name">Tournament Name:</label>
                <input type="text" id="tournament_name" name="tournament_name" required
                       placeholder="Friday Night Padel">
            </div>

            <div class="form-group">
                <label for="num_courts">Number of Courts (1-9):</label>
                <input type="number" id="num_courts" name="num_courts" min="1" max="9"
                       required value="2">
            </div>

            <div class="form-group">
                <label for="players">Players (one per line):</label>
                <textarea id="players" name="players" rows="12" required
                          placeholder="Alice&#10;Bob&#10;Charlie&#10;Diana&#10;Eva&#10;Frank&#10;Grace&#10;Henry"></textarea>
                <small>Enter at least 4 players per court (e.g., 8 players for 2 courts)</small>
            </div>

            <button type="submit" class="btn-primary">Create Tournament</button>
            <a href="{{ url_for('index') }}" class="btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
