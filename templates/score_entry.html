<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Score - Court {{ match['court_number'] }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Mobile-optimized score entry */
        body {
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }
        .score-entry {
            max-width: 600px;
            margin: 0 auto;
            padding: 1rem;
        }
        .score-header {
            text-align: center;
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .score-header h1 {
            font-size: 2rem;
            margin: 0 0 0.5rem 0;
            color: #2c3e50;
        }
        .score-header h2 {
            font-size: 1.3rem;
            margin: 0;
            color: #666;
            font-weight: 500;
        }
        .team-selection {
            margin: 1.5rem 0;
        }
        .team-option {
            display: block;
            margin-bottom: 1.5rem;
            cursor: pointer;
        }
        .team-option input[type="radio"] {
            display: none;
        }
        .team-box {
            border: 4px solid #ddd;
            border-radius: 12px;
            padding: 2rem 1.5rem;
            text-align: center;
            background: white;
            transition: all 0.3s ease;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .team-option:active .team-box {
            transform: scale(0.98);
        }
        .team-option input[type="radio"]:checked + .team-box {
            border-color: #3498db;
            background: #ebf5fb;
            box-shadow: 0 4px 16px rgba(52, 152, 219, 0.4);
            transform: scale(1.02);
        }
        .team-box strong {
            display: block;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #2c3e50;
            font-weight: 700;
        }
        .team-box p {
            font-size: 1.2rem;
            margin: 0.3rem 0;
            color: #555;
            line-height: 1.6;
        }
        .btn-submit {
            width: 100%;
            font-size: 1.4rem;
            padding: 1.5rem;
            margin: 1rem 0;
            border: none;
            border-radius: 12px;
            background: #27ae60;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
        }
        .btn-submit:active {
            transform: scale(0.98);
            box-shadow: 0 2px 6px rgba(39, 174, 96, 0.3);
        }
        .btn-submit:hover {
            background: #229954;
        }
        .btn-cancel {
            display: block;
            width: 100%;
            text-align: center;
            padding: 1rem;
            color: #666;
            text-decoration: none;
            font-size: 1.1rem;
            background: white;
            border-radius: 8px;
            border: 2px solid #ddd;
        }
        .btn-cancel:hover {
            background: #f5f5f5;
        }
        .messages {
            margin: 1rem 0;
        }
        .message {
            padding: 1rem;
            border-radius: 8px;
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            text-align: center;
            font-size: 1.1rem;
        }
        @media (max-width: 480px) {
            .score-entry {
                padding: 0.5rem;
            }
            .team-box {
                padding: 1.5rem 1rem;
                min-height: 100px;
            }
            .team-box strong {
                font-size: 1.3rem;
            }
            .team-box p {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container score-entry">
        <div class="score-header">
            <h1>🎾 Court {{ match['court_number'] }}</h1>
            <h2>{% if match['completed'] %}Edit Score{% else %}Who Won?{% endif %}</h2>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <div class="message">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form id="scoreForm" method="POST">
            <div class="team-selection">
                <label class="team-option">
                    <input type="radio" name="winning_team" value="1" {% if match['completed'] and match['winning_team'] == 1 %}checked{% endif %} required>
                    <div class="team-box">
                        <strong>Team 1</strong>
                        <p>{{ match['player1_name'] }}</p>
                        <p>{{ match['player2_name'] }}</p>
                    </div>
                </label>

                <label class="team-option">
                    <input type="radio" name="winning_team" value="2" {% if match['completed'] and match['winning_team'] == 2 %}checked{% endif %} required>
                    <div class="team-box">
                        <strong>Team 2</strong>
                        <p>{{ match['player3_name'] }}</p>
                        <p>{{ match['player4_name'] }}</p>
                    </div>
                </label>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                ✅ {% if match['completed'] %}Update Winner{% else %}Confirm Winner{% endif %}
            </button>

            <a href="{{ url_for('active_round', tournament_id=match['tournament_id'], round_id=match['round_id']) }}"
               class="btn-cancel">← Back to Matches</a>
        </form>

        <script>
            // Prevent browser HTTP warning by using fetch instead of form submission
            document.getElementById('scoreForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const form = e.target;
                const submitBtn = document.getElementById('submitBtn');
                const selectedTeam = form.querySelector('input[name="winning_team"]:checked');

                if (!selectedTeam) {
                    alert('Please select a winning team');
                    return;
                }

                // Disable button and show loading
                submitBtn.disabled = true;
                submitBtn.textContent = '⏳ Saving...';

                try {
                    const formData = new FormData(form);
                    const response = await fetch(form.action || window.location.href, {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        // Success - redirect to matches page
                        window.location.href = '{{ url_for("active_round", tournament_id=match["tournament_id"], round_id=match["round_id"]) }}';
                    } else {
                        alert('Error saving score. Please try again.');
                        submitBtn.disabled = false;
                        submitBtn.textContent = '✅ {% if match["completed"] %}Update Winner{% else %}Confirm Winner{% endif %}';
                    }
                } catch (error) {
                    alert('Error saving score. Please try again.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '✅ {% if match["completed"] %}Update Winner{% else %}Confirm Winner{% endif %}';
                }
            });
        </script>
    </div>
</body>
</html>
